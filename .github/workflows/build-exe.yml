name: Build EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pyinstaller --onefile --windowed --name Snake --icon=assets/icon.ico --add-data "assets;assets" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: Snake-exe
          path: dist/Snake.exe
